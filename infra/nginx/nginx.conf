# Nginx — edge layer (docs/02 §2.3, §12.1)
# Load balancer + SSL termination + rate limit per IP + proxy WebSocket (Socket.io, T1.13).

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # Rate limit per IP (S-04) — login 5 req/menit (T1.3); API 100 req/menit (default)
  limit_req_zone $binary_remote_addr zone=login_limit:1m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=api_limit:1m rate=100r/m;

  upstream backend {
    # Horizontal scaling: tambah server backend-2, backend-3 sesuai kebutuhan (docs/02 §7.3)
    server backend:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # Redirect HTTP → HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/ssl/siak/fullchain.pem;
    ssl_certificate_key /etc/ssl/siak/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Static frontend (React build)
    root /usr/share/nginx/html;
    index index.html;
    location / {
      try_files $uri $uri/ /index.html;
    }

    # API
    location /api/ {
      limit_req zone=api_limit burst=50 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth (rate limit lebih ketat — anti brute force, F-04)
    location /api/v1/auth/ {
      limit_req zone=login_limit burst=5 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (Socket.io — waiting room & notifikasi)
    location /socket.io/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 86400;
    }
  }
}
