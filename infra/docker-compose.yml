# Docker Compose — Development (T1.1)
# Menjalankan PostgreSQL 16 + Redis 7 + migrate + backend + frontend untuk pengembangan lokal.
# Usage: docker compose -f infra/docker-compose.yml up -d --build

name: siak-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: siak-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siak}
      POSTGRES_USER: ${POSTGRES_USER:-siak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siak_dev_password}
    ports:
      # Host 5433 (default) — 5432 di mesin ini dipakai container siakad_* (iterasi lama).
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-siak} -d ${POSTGRES_DB:-siak}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: siak-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # Host 6380 (default) — 6379 di mesin ini dipakai container siakad_* (iterasi lama).
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ../backend
      target: migrate
    container_name: siak-migrate
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-siak}:${POSTGRES_PASSWORD:-siak_dev_password}@postgres:5432/${POSTGRES_DB:-siak}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-please-change-this-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: ../backend
    container_name: siak-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-siak}:${POSTGRES_PASSWORD:-siak_dev_password}@postgres:5432/${POSTGRES_DB:-siak}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-please-change-this-secret}
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../frontend
    container_name: siak-frontend
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
