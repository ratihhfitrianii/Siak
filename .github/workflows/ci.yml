# CI Pipeline — Siak (docs/03 §8 Quality Gates)
# Gate: lint (0 error/warning) → typecheck (0 error) → unit test (coverage ≥80%) → build → docker build.
# Deploy staging: auto dari branch main (manual trigger production — docs/03 §10).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend — lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: siak
          POSTGRES_PASSWORD: siak_dev_password
          POSTGRES_DB: siak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: siak
      PGPASSWORD: siak_dev_password
      PGDATABASE: siak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --workspaces --include-workspace-root
      - name: Allow install scripts
        run: npm config set ignore-scripts false
      - run: npm run lint --workspace=backend
      - run: npm run format:check --workspace=backend
      - run: npm run typecheck --workspace=backend
      - name: Run DB migrations (V001–V018)
        run: npx node-pg-migrate up -f database.json --config-value db
        working-directory: backend
      - run: npm run test:coverage --workspace=backend
      - run: npm run build --workspace=backend

  frontend-quality:
    name: Frontend — lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --workspaces --include-workspace-root
      - name: Allow install scripts
        run: npm config set ignore-scripts false
      - run: npm run lint --workspace=frontend
      - run: npm run format:check --workspace=frontend
      - run: npm run typecheck --workspace=frontend
      # T1.11d: coverage threshold ≥80% (vite.config.ts) — konsisten dengan backend
      - run: npm run test:coverage --workspace=frontend
      - run: npm run build --workspace=frontend

  security-scan:
    name: Security scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --workspaces --include-workspace-root
      - name: Allow install scripts
        run: npm config set ignore-scripts false
      - name: Audit backend (production deps only)
        run: npm audit --audit-level=high --omit=dev --workspace=backend
      - name: Audit frontend (production deps only)
        run: npm audit --audit-level=high --omit=dev --workspace=frontend

  e2e:
    name: E2E (Playwright — critical path login)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: siak
          POSTGRES_PASSWORD: siak_dev_password
          POSTGRES_DB: siak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: siak
      PGPASSWORD: siak_dev_password
      PGDATABASE: siak
      JWT_SECRET: ci-e2e-secret-min-16-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --workspaces --include-workspace-root
      - name: Allow install scripts
        run: npm config set ignore-scripts false
      - name: Run DB migrations
        run: npx node-pg-migrate up -f database.json --config-value db
        working-directory: backend
      - name: Seed E2E users
        run: npx tsx scripts/seed-e2e.ts
        working-directory: backend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: frontend

  build-docker:
    name: Build Docker images
    needs: [backend-quality, frontend-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t siak-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t siak-frontend:ci ./frontend

  deploy-staging:
    name: Deploy staging
    needs: [build-docker, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        run: |
          echo "Deploy staging diimplementasikan pada T1.15."
          echo "Menggunakan secrets: STAGING_HOST, STAGING_USER, STAGING_SSH_KEY"
          # Contoh (aktifkan saat T1.15):
          # rsync -az --delete ./ "$STAGING_USER@$STAGING_HOST:/opt/siak" \
          #   -e "ssh -i $STAGING_SSH_KEY -o StrictHostKeyChecking=no"
          # ssh "$STAGING_USER@$STAGING_HOST" \
          #   -i "$STAGING_SSH_KEY" \
          #   "cd /opt/siak && docker compose -f infra/docker-compose.prod.yml up -d --build"
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}