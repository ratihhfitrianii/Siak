# CI Pipeline — Siak (docs/03 §8 Quality Gates)
# Gate: lint (0 error/warning) → typecheck (0 error) → unit test (coverage ≥80%) → build → docker build.
# Deploy staging: auto dari branch main (manual trigger production — docs/03 §10).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  frontend-quality:
    name: Frontend — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  security-scan:
    name: Security scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit backend (production deps only)
        working-directory: backend
        run: npm audit --audit-level=high --omit=dev
      - name: Audit frontend (production deps only)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

  build-docker:
    name: Build Docker images
    needs: [backend-quality, frontend-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t siak-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t siak-frontend:ci ./frontend

  deploy-staging:
    name: Deploy staging
    needs: [build-docker, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        run: |
          echo "Deploy staging diimplementasikan pada T1.15."
          echo "Menggunakan secrets: STAGING_HOST, STAGING_USER, STAGING_SSH_KEY"
          # Contoh (aktifkan saat T1.15):
          # rsync -az --delete ./ "$STAGING_USER@$STAGING_HOST:/opt/siak" \
          #   -e "ssh -i $STAGING_SSH_KEY -o StrictHostKeyChecking=no"
          # ssh "$STAGING_USER@$STAGING_HOST" \
          #   -i "$STAGING_SSH_KEY" \
          #   "cd /opt/siak && docker compose -f infra/docker-compose.prod.yml up -d --build"
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
